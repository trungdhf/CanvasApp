- sbRoot:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      Height: =Parent.Height
      Width: =Parent.Width
    Children:
      - sbDateKey:
          Control: ModernText@1.0.0
          Properties:
            Height: =10
            Text: =Text(Coalesce(varSbDate, Today()), "yyyy-mm-dd")
            Visible: =false
            Width: =10
      - sbBranchKey:
          Control: ModernText@1.0.0
          Properties:
            Height: =10
            Text: =Coalesce(sbBranch.Selected.Value, First(Distinct(社員, 拠点)).Value)
            Visible: =false
            Width: =10
      - sbHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(59, 89, 152, 1)
            Height: =64
            Width: =Parent.Width
          Children:
            - sbTitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =44
                  Size: =20
                  Text: |-
                    ="📋 スケジュールボード"
                  Width: =260
                  Wrap: =false
                  X: =16
                  Y: =10
            - sbBranch:
                Control: ModernDropdown@1.0.3
                Properties:
                  AccessibleLabel: ="拠点"
                  Default: =First(Distinct(社員, 拠点))
                  Height: =36
                  ItemDisplayText: =ThisItem.Value
                  Items: =Distinct(社員, 拠点)
                  Width: =170
                  X: =284
                  Y: =14
            - sbPrev:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  OnSelect: =Set(varSbDate, DateAdd(Coalesce(varSbDate, Today()), -1, TimeUnit.Days))
                  Text: ="◀ 前日"
                  Width: =90
                  X: =466
                  Y: =14
            - sbDateLabel:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =18
                  Text: =Text(Coalesce(varSbDate, Today()), "yyyy/mm/dd (ddd)")
                  Width: =190
                  X: =562
                  Y: =14
            - sbNext:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  OnSelect: =Set(varSbDate, DateAdd(Coalesce(varSbDate, Today()), 1, TimeUnit.Days))
                  Text: ="翌日 ▶"
                  Width: =90
                  X: =758
                  Y: =14
            - sbToday:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  OnSelect: =Set(varSbDate, Today())
                  Text: ="今日"
                  Width: =70
                  X: =856
                  Y: =14
            - sbRefresh:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  OnSelect: |-
                    =Refresh(予定);
                    Refresh(社員)
                  Text: |-
                    ="🔄 更新"
                  Width: =90
                  X: =934
                  Y: =14
            - sbGroup:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  OnSelect: |-
                    =Set(varGsBranch, sbBranchKey.Text);
                    Set(varGsDept, Blank());
                    Navigate(グループスケジュール)
                  Text: |-
                    ="👥 グループ"
                  Width: =106
                  X: =1032
                  Y: =14
            - sbInfo:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =34
                  Size: =11
                  Text: '=CountRows(Filter(社員, 拠点 = sbBranchKey.Text)) & " 名 " '
                  Width: =Max(60, Parent.Width - 1160)
                  Wrap: =false
                  X: =1146
                  Y: =14
      - sb0H1:
          Control: ModernText@1.0.0
          Properties:
            BorderColor: =RGBA(241, 244, 249, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0.05
            Color: =RGBA(0, 18, 107, 1)
