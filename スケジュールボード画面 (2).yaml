                  OnSelect: "=If(\n    Len(sbEdShare.Text) > 80,\n    Notify(\"共有内容は80文字以内で入力してください\", NotificationType.Error),\n    With(\n        {\n            wt: If(sbEdWt.Selected.Value = \"（なし）\", \"\", sbEdWt.Selected.Value),\n            rt: If(sbEdRet.Selected.Value = \"（なし）\", \"\", sbEdRet.Selected.Value),\n            r: LookUp(予定, Title = varSbEdit.name && 日付 = sbDateKey.Text)\n        },\n        IfError(\n            If(\n                IsBlank(r),\n                Patch(予定, Defaults(予定), {Title: varSbEdit.name, 日付: sbDateKey.Text, 勤務区分: wt, 共有内容: sbEdShare.Text, 帰社時間: rt}),\n                Patch(予定, r, {勤務区分: wt, 共有内容: sbEdShare.Text, 帰社時間: rt})\n            );\n            \n            Refresh(予定);\n            Refresh(社員);\n            Set(varSbShow, false);\n            Notify(\"保存しました\", NotificationType.Success),\n            Notify(\"保存できませんでした: \" & FirstError.Message, NotificationType.Error)\n        )\n    )\n)"
