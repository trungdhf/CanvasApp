            X: =166
            Y: =77
      - sb0H4:
          Control: ModernText@1.0.0
          Properties:
            BorderColor: =RGBA(241, 244, 249, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0.05
            Color: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(232, 244, 217, 1)
            Height: =28
            Size: =12
            Text: ="戻り"
            Width: =76
            Wrap: =false
            X: =375
            Y: =77
      - sb0Col:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 106
            Items: |-
              =With(
                  {emp: Filter(社員, 拠点 = sbBranchKey.Text), sc: Filter(予定, 日付 = sbDateKey.Text)},
                  With(
                      {d: Sort(Distinct(emp, 部署), Value)},
                      With(
                          {cd: ForAll(
                              Filter(ForAll(Sequence(CountRows(d)) As s, {i: s.Value, dept: Index(d, s.Value).Value}), Mod(i - 1, 3) = 0) As x,
                              {dept: x.dept, n: CountRows(Filter(emp, 部署 = x.dept))}
                          )},
                          With(
                              {cs: ForAll(
                                  Sequence(CountRows(cd)) As j,
                                  {dept: Index(cd, j.Value).dept, n: Index(cd, j.Value).n, st: Coalesce(Sum(FirstN(cd, j.Value - 1), n + 1), 0)}
                              )},
                              ForAll(
                                  Sequence(Coalesce(Sum(cs, n + 1), 0)) As q,
                                  With(
                                      {g: LookUp(cs, q.Value > st && q.Value <= st + n + 1)},
                                      If(
                                          q.Value - g.st = 1,
                                          {kind: "h", dept: g.dept, name: "", ext: "", wt: "", share: "", ret: ""},
                                          With(
                                              {pp: Index(Sort(Filter(emp, 部署 = g.dept), Value(表示順)), q.Value - g.st - 1)},
                                              With(
                                                  {r: LookUp(sc, Title = pp.Title)},
                                                  {kind: "p", dept: g.dept, name: Text(pp.Title), ext: Text(pp.内線), wt: Text(r.勤務区分), share: Text(r.共有内容), ret: Text(r.帰社時間)}
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            TemplatePadding: =0
            TemplateSize: =40
            Width: =(Parent.Width - 48) / 3
            X: =16 + 0 * ((Parent.Width - 48) / 3 + 8)
            Y: =98
          Children:
            - sb0HdrBg:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(59, 89, 152, 1)
                  Height: =Parent.TemplateHeight - 6
                  Visible: =ThisItem.kind = "h"
                  Width: =Parent.TemplateWidth
                  Y: =6
            - sb0HdrText:
                Control: ModernText@1.0.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =34
                  Size: =14
                  Text: =ThisItem.dept
                  Visible: =ThisItem.kind = "h"
                  Width: =Parent.TemplateWidth - 20
                  Wrap: =false
                  X: =10
                  Y: =6
            - sb0HdrTap:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Parent.TemplateHeight - 6
                  HoverFill: =RGBA(255, 255, 255, 0.18)
                  OnSelect: |-
                    =Set(varGsBranch, sbBranchKey.Text);
                    Set(varGsDept, ThisItem.dept);
                    Navigate(グループスケジュール)
                  PressedFill: =RGBA(255, 255, 255, 0.3)
                  Visible: =ThisItem.kind = "h"
                  Width: =Parent.TemplateWidth
                  Y: =6
            - sb0RowBg:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(Find("休暇", ThisItem.wt) > 0 || Find("出張", ThisItem.wt) > 0 || Find("外出", ThisItem.wt) > 0, RGBA(236, 236, 236, 1), RGBA(255, 255, 255, 1))
                  Height: =Parent.TemplateHeight - 1
                  Visible: =ThisItem.kind = "p"
                  Width: =Parent.TemplateWidth
            - sb0Sep:
