- sbRoot:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      Height: =Parent.Height
      Width: =Parent.Width
    Children:
      - sbDateKey:
          Control: ModernText@1.0.0
          Properties:
            Height: =10
            Text: =Text(Coalesce(varSbDate, Today()), "yyyy-mm-dd")
            Visible: =false
            Width: =10
      - sbBranchKey:
          Control: ModernText@1.0.0
          Properties:
            Height: =10
            Text: =Coalesce(sbBranch.Selected.Value, First(Distinct(社員, ボード)).Value)
            Visible: =false
            Width: =10
      - sbHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(59, 89, 152, 1)
            Height: =48
            Width: =Parent.Width
          Children:
            - sbBranch:
                Control: ModernDropdown@1.0.3
                Properties:
                  AccessibleLabel: ="拠点"
                  Default: |-
                    ={Value: Coalesce(varSbBranch, Trim(Text(LookUp(社員, User().Email in メール.Email).ボード)), First(Distinct(社員, ボード)).Value)}
                  Height: =36
                  ItemDisplayText: =ThisItem.Value
                  Items: =Distinct(社員, ボード)
                  Width: =450
                  X: =119
                  Y: =6
            - sbPrev:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Color: =RGBA(255, 255, 0, 1)
                  Height: =36
                  OnSelect: =Set(varSbDate, DateAdd(Coalesce(varSbDate, Today()), -1, TimeUnit.Days))
                  Text: ="◀ "
                  Width: =40
                  X: =sbDateLabel.X - Self.Width - 4
                  Y: =6
            - sbDateLabel:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =Parent.Height
                  Size: =18
                  Text: =Text(Coalesce(varSbDate, Today()), "yyyy/mm/dd (ddd)")
                  Width: =190
                  X: |-
                    =With(
                        {
                            leftEdge: Max(sbBranch.X + sbBranch.Width, sbInfo.X + sbInfo.Width) + 8,
                            rightEdge: menuBTN.X - 8,
                            groupWidth: sbPrev.Width + 4 + Self.Width + 4 + sbNext.Width + 8 + sbToday.Width + 8 + sbRefresh.Width
                        },
                        leftEdge + (rightEdge - leftEdge - groupWidth) / 2 + sbPrev.Width + 4
                    )
            - sbNext:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Subtle
                  Color: =RGBA(255, 255, 0, 1)
                  Height: =36
                  Icon: ="ArrowRight"
                  IconStyle: =IconStyle.Filled
                  Layout: =ButtonLayout.TextOnly
                  OnSelect: =Set(varSbDate, DateAdd(Coalesce(varSbDate, Today()), 1, TimeUnit.Days))
                  Text: =" ▶"
                  Width: =40
                  X: =sbDateLabel.X + sbDateLabel.Width + 4
                  Y: =6
            - sbToday:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =35
                  OnSelect: =Set(varSbDate, Today())
                  Text: ="今日"
                  Width: =60
                  X: =sbNext.X + sbNext.Width + 8
                  Y: =6
            - sbRefresh:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  Appearance: =ButtonAppearance.Subtle
                  Color: =RGBA(255, 255, 0, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =35
                  Icon: ="ArrowSync"
                  IconStyle: =IconStyle.Filled
                  Layout: =ButtonLayout.IconOnly
                  OnSelect: |-
                    =Refresh(予定);
                    Refresh(社員)
                  Size: =20
                  Text: =
                  Width: =35
                  X: =sbToday.X + sbToday.Width + 8
                  Y: =6
            - sbInfo:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =33
                  Size: =13
                  Text: '="計 "&CountRows(Filter(社員, ボード = sbBranchKey.Text)) & " 名 " '
                  Width: =70
                  Wrap: =false
                  X: =567
                  Y: =8
            - Container1:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =42
                  Width: =200
                  X: =10
                  Y: =6
                Children:
                  - Image1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =42
                        Image: ='logo_dhf1 (1)'
                        Width: =35
                  - Image1_1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =42
                        Image: =logo_dhf2
                        Width: =58
                        X: =40
            - menuBTN:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  Appearance: =ButtonAppearance.Subtle
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =35
                  Icon: ="Navigation"
                  IconStyle: =IconStyle.Filled
                  Layout: =ButtonLayout.IconOnly
                  OnSelect: =Set(varSbMenuShow, !varSbMenuShow)
                  Size: =20
                  Text: =
                  Width: =45
                  X: =Parent.Width - Self.Width - 10
                  Y: =8
      - sbMenu:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            Visible: =varSbMenuShow
            Width: =180
            X: =Parent.Width - Self.Width - 10
            Y: =50
          Children:
            - sbMenuBulletin:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Left
                  Appearance: =ButtonAppearance.Subtle
                  Height: =Parent.Height
                  OnSelect: =Set(varSbMenuShow, false)
                  Text: ="掲示板"
                  Width: =Parent.Width
      - sb0H1:
          Control: ModernText@1.0.0
          Properties:
            BorderColor: =RGBA(241, 244, 249, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0.05
            Color: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(232, 244, 217, 1)
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="名前"
            Width: =82
            Wrap: =false
            X: =sb0Col.X
            Y: =48
      - sb0H3:
          Control: ModernText@1.0.0
          Properties:
            BorderColor: =RGBA(241, 244, 249, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0.05
            Color: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(232, 244, 217, 1)
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="行先"
            Width: =sb0Col.Width - 132
            Wrap: =false
            X: =sb0Col.X + 82
            Y: =48
      - sb0H4:
          Control: ModernText@1.0.0
          Properties:
            BorderColor: =RGBA(241, 244, 249, 1)
            BorderStyle: =BorderStyle.None
            BorderThickness: =0.05
            Color: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(232, 244, 217, 1)
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: ="戻り"
            Width: =50
            Wrap: =false
            X: =sb0Col.X + sb0Col.Width - 50
            Y: =48
      - sb0Col:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 82
            Items: |-
              =With(
                {emp: Filter(社員, ボード = sbBranchKey.Text && Value(列) = 1), sc: Filter(予定, 日付 = sbDateKey.Text)},
                  With(
                  {d: Sort(ForAll(Distinct(emp, 部署) As x, {部署: x.Value, deptOrder: Min(Filter(emp, 部署 = x.Value), Value(部署順))}), deptOrder, SortOrder.Ascending)},
                      With(
                          {cd: ForAll(
                      Sequence(CountRows(d)) As s,
                      {dept: Index(d, s.Value).部署, n: CountRows(Filter(emp, 部署 = Index(d, s.Value).部署))}
                          )},
                          With(
                              {cs: ForAll(
                                  Sequence(CountRows(cd)) As j,
                                  {dept: Index(cd, j.Value).dept, n: Index(cd, j.Value).n, st: Coalesce(Sum(FirstN(cd, j.Value - 1), n + 1), 0)}
                              )},
                              ForAll(
                                  Sequence(Coalesce(Sum(cs, n + 1), 0)) As q,
                                  With(
                                      {g: LookUp(cs, q.Value > st && q.Value <= st + n + 1)},
                                      If(
                                          q.Value - g.st = 1,
                                          {kind: "h", dept: g.dept, name: "", wt: "", share: "", ret: "", isDeptEnd: g.n = 0, upd: DateTime(2000, 1, 1, 0, 0, 0)},
                                          With(
                                              {pp: Index(Sort(Filter(emp, 部署 = g.dept), Value(表示順)), q.Value - g.st - 1)},
                                              With(
                                                  {r: LookUp(sc, Title = pp.Title)},
                                                  {kind: "p", dept: g.dept, name: Text(pp.Title), wt: Text(r.勤務区分), share: Text(r.共有内容), ret: Text(r.帰社時間), isDeptEnd: q.Value = g.st + g.n + 1, upd: r.Modified}
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =32
            Width: =(Parent.Width - 48) / 3
            X: =16 + 0 * ((Parent.Width - 48) / 3 + 8)
            Y: =74
          Children:
            - sb0HdrText:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =RGBA(59, 89, 152, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =Parent.TemplateHeight
                  PaddingBottom: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =9
                  Text: =ThisItem.dept
                  Visible: =ThisItem.kind = "h"
                  Width: =Parent.TemplateWidth
                  Wrap: =false
                  Y: =0
            - sb0HdrTap:
