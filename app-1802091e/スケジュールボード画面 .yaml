                  Fill: =RGBA(220, 224, 232, 1)
                  Height: =1
                  Visible: =ThisItem.kind = "p"
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
            - sb0Name:
