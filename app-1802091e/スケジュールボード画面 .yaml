                  OnSelect: |-
                    =Set(varGsBranch, sbBranchKey.Text);
                    Set(varGsDept, Text(ThisItem.dept));
                    Navigate(グループスケジュール);
                    Reset(gsBranch);
                    Reset(gsDept)
                  PressedFill: =RGBA(255, 255, 255, 0.3)
                  Visible: =ThisItem.kind = "h"
                  Width: =Parent.TemplateWidth
                  Y: =0
            - sb0RowBg:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        !IsBlank(ThisItem.upd) && DateDiff(ThisItem.upd, Coalesce(varSbNow, Now()), TimeUnit.Minutes) < 2, RGBA(255, 241, 118, 1),
                        Find("休暇", ThisItem.wt) > 0 || Find("休業", ThisItem.wt) > 0, RGBA(252, 228, 236, 1),
                        Find("出張", ThisItem.wt) > 0 || Find("外出", ThisItem.wt) > 0 || Find("テレワーク", ThisItem.wt) > 0, RGBA(236, 236, 236, 1),
                        RGBA(255, 255, 255, 1)
                    )
                  Height: =Parent.TemplateHeight - 1
                  Visible: =ThisItem.kind = "p"
                  Width: =Parent.TemplateWidth
            - sb0Sep:
