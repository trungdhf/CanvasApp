                  Visible: =ThisItem.kind = "p"
                  Width: =80
                  Wrap: =false
            - sb0BadgeBg:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =ColorValue(Coalesce(LookUp(予定選択肢, Title = sbBranchKey.Text && 種類 = "勤務区分" && 値 = ThisItem.wt).背景色, "#E8EAF6"))
                  Height: =19
