                    Set(varPsBranch, sbBranchKey.Text);
                    Set(varPsMonth, Date(Year(Coalesce(varSbDate, Today())), Month(Coalesce(varSbDate, Today())), 1));
                    Set(varPsShow, false);
                    Set(varSbUserShow, false);
                    Navigate(個人スケジュール)
                  Text: |-
                    ="📅 個人スケジュール"
                  Width: =170
                  X: =24
                  Y: =208
            - sbUsrClose:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =40
                  OnSelect: =Set(varSbUserShow, false)
                  Text: ="閉じる"
                  Width: =170
                  X: =206
                  Y: =208
      - sbToast:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Fill: =If(varSbToast.ok, RGBA(46, 125, 50, 1), RGBA(198, 40, 40, 1))
            FontWeight: =FontWeight.Semibold
            Height: =40
            Size: =13
            Text: =varSbToast.msg
            Visible: =!IsBlank(varSbToast)
            Width: =Min(480, Parent.Width - 32)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height - 64
      - sbToastTimer:
          Control: Timer@2.1.0
          Properties:
            Duration: =2500
            OnTimerEnd: =Set(varSbToast, Blank())
            Start: =!IsBlank(varSbToast)
            Visible: =false
      - sbInitTimer:
          Control: Timer@2.1.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Duration: =300
            Fill: =RGBA(0, 0, 0, 0)
            Height: =2
            OnTimerEnd: |-
              =Set(varSbBranch, Trim(Text(LookUp(社員, User().Email in メール.Email).ボード)));
              Reset(sbBranch)
            Start: =!IsEmpty(社員)
            Width: =2
      - sbAutoRefreshTimer:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            BorderThickness: =0
            Color: =RGBA(0, 0, 0, 0)
            Duration: =15000
            Fill: =RGBA(0, 0, 0, 0)
            Height: =2
            OnTimerEnd: |-
              =Set(varSbNow, Now());
              If(
                  !varSbShow && !varSbUserShow,
                  ClearCollect(colSbLatest, FirstN(Sort(予定, Modified, SortOrder.Descending), 1));
                  With(
                      {m: First(colSbLatest).Modified},
                      If(
                          IsBlank(varSbLastMod),
                          Set(varSbLastMod, m),
                          m <> varSbLastMod,
                          Set(varSbLastMod, m);
                          Refresh(予定)
                      )
                  )
              )
            Repeat: =true
            Width: =2
      - sbRouteTimer:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =100
            OnTimerEnd: =If(App.Width < 700, Navigate(スケジュールボード_SP), App.Width > 2000, Navigate(スケジュールボード_WIDE))
            Visible: =false
