              =With(
                  {emp: Filter(社員, ボード = wbBranchKey.Text && Value(列) = 3), sc: Filter(予定, 日付 = wbDateKey.Text)},
                  With(
                      {d: Sort(ForAll(Distinct(emp, 部署) As x, {部署: x.Value, deptOrder: Min(Filter(emp, 部署 = x.Value), Value(部署順))}), deptOrder, SortOrder.Ascending)},
                      With(
                          {cd: ForAll(Sequence(CountRows(d)) As s, {dept: Index(d, s.Value).部署, n: CountRows(Filter(emp, 部署 = Index(d, s.Value).部署))})},
                          With(
                              {cs: ForAll(Sequence(CountRows(cd)) As j, {dept: Index(cd, j.Value).dept, n: Index(cd, j.Value).n, st: Coalesce(Sum(FirstN(cd, j.Value - 1), n + 1), 0)})},
                              ForAll(
                                  Sequence(Coalesce(Sum(cs, n + 1), 0)) As q,
                                  With(
                                      {g: LookUp(cs, q.Value > st && q.Value <= st + n + 1)},
                                      If(
                                          q.Value - g.st = 1,
                                          {kind: "h", dept: g.dept, name: "", wt: "", share: "", ret: "", isDeptEnd: g.n = 0, upd: DateTime(2000, 1, 1, 0, 0, 0)},
                                          With(
                                              {pp: Index(Sort(Filter(emp, 部署 = g.dept), Value(表示順)), q.Value - g.st - 1)},
