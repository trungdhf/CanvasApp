            OnTimerEnd: |-
              =Set(varSbBranch, Trim(Text(LookUp(社員, User().Email in メール.Email).ボード)));
              Reset(wbBranch)
            Start: =!IsEmpty(社員)
            Visible: =false
      - wbAutoRefreshTimer:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =15000
            OnTimerEnd: |-
              =Set(varSbNow, Now());
              If(
                  !varSbShow && !varSbUserShow,
                  ClearCollect(colSbLatest, FirstN(Sort(予定, Modified, SortOrder.Descending), 1));
                  With(
                      {m: First(colSbLatest).Modified},
                      If(
                          IsBlank(varSbLastMod),
                          Set(varSbLastMod, m),
                          m <> varSbLastMod,
                          Set(varSbLastMod, m);
                          Refresh(予定)
                      )
                  )
              )
            Repeat: =true
            Visible: =false
      - wbRouteTimer:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =100
            OnTimerEnd: =If(App.Width < 700, Navigate(スケジュールボード_SP))
            Visible: =false
